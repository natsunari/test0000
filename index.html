<title>聖誕交換禮物抽籤</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: one narrow column — names and colors side by side, one draw button, then every pairing as a gift tag. */
:root {
  --bg: #f3f5f1;
  --surface: #ffffff;
  --ink: #1d2a24;
  --muted: #5d6b64;
  --line: #d6ddd7;
  --pine: #1f5a43;
  --pine-ink: #ffffff;
  --berry: #b3263a;
  --gold: #b8892b;
  --tag: #fbf6ea;
  --tag-ink: #3a2e1a;
  --font-display: "LXGW WenKai TC", "Kaiti TC", "STKaiti", serif;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111915; --surface: #18231e; --ink: #e6ede8; --muted: #9db0a6; --line: #2c3b34;
    --pine: #5fb48c; --pine-ink: #0d1612; --berry: #ef6b7c; --gold: #d9ad52;
    --tag: #2a2519; --tag-ink: #f1e6cc; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111915; --surface: #18231e; --ink: #e6ede8; --muted: #9db0a6; --line: #2c3b34;
  --pine: #5fb48c; --pine-ink: #0d1612; --berry: #ef6b7c; --gold: #d9ad52;
  --tag: #2a2519; --tag-ink: #f1e6cc; color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 48px;
}
.wrap { max-width: 680px; margin: 0 auto; display: grid; gap: 20px; }

header { display: grid; gap: 6px; }
.eyebrow { font-size: 12px; letter-spacing: .12em; color: var(--berry); font-weight: 700; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(30px, 7vw, 42px); line-height: 1.15; margin: 0; text-wrap: balance; }
header p { margin: 0; color: var(--muted); }
.rules { margin: 4px 0 0; padding-left: 1.3em; color: var(--muted); display: grid; gap: 4px; }
.rules b { color: var(--ink); }
.rules li::marker { color: var(--gold); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; display: grid; gap: 18px; }
.field { display: grid; gap: 6px; }
.field label { font-weight: 700; font-size: 14px; }
.hint { font-size: 13px; color: var(--muted); margin: 0; }
textarea {
  width: 100%; font: inherit; color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; resize: vertical;
}
textarea:focus-visible, button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.row > * { min-width: 0; }
@media (max-width: 520px) { .row { grid-template-columns: 1fr; } }

.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
button { font: inherit; cursor: pointer; border-radius: 8px; padding: 10px 18px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
button.primary { background: var(--pine); color: var(--pine-ink); border-color: var(--pine); font-weight: 700; }
button.big { font-size: 18px; padding: 14px 28px; }
button.ghost { background: transparent; }
button:hover { filter: brightness(1.06); }
.count { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.note { font-size: 13px; color: var(--muted); }

.msg { margin: 0; font-size: 14px; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--berry); color: var(--berry); }
.example { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 99px; border: 1px dashed var(--muted); color: var(--muted); margin-left: 6px; font-weight: 400; vertical-align: middle; }

/* Results: one gift tag per pairing */
.results-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px; }
.results-head h2 { font-family: var(--font-display); font-size: 24px; margin: 0; }
.list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 340px) { .list { grid-template-columns: 1fr; } }
.pair {
  position: relative; background: var(--tag); color: var(--tag-ink); border: 1px solid var(--line);
  border-radius: 6px 14px 14px 6px; padding: 10px 10px 10px 30px;
  display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 10px;
}
.pair::before {
  content: ""; position: absolute; left: 11px; top: 50%; width: 9px; height: 9px; margin-top: -4.5px;
  border-radius: 50%; background: var(--surface); border: 1.5px solid var(--gold);
}
.pair .p { font-family: var(--font-display); font-size: 18px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 480px) {
  #results.panel { padding: 16px 12px; }
  .list { gap: 8px; }
  .pair { padding: 9px 7px 9px 22px; gap: 6px; }
  .pair::before { left: 8px; width: 7px; height: 7px; margin-top: -3.5px; }
  .pair .p { font-size: 17px; }
}
@media (max-width: 370px) {
  .pair { padding-right: 5px; gap: 4px; }
  .pair .p { font-size: 15px; }
  .chip { gap: 3px; padding: 1px 7px 1px 2px; font-size: 14px; }
  .sw { width: 14px; height: 14px; }
}
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 10px 2px 3px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 700; white-space: nowrap; }
.chip.nosw { padding-left: 10px; }
.sw { width: 18px; height: 18px; border-radius: 50%; flex: none; border: 1px solid var(--line); background: var(--sw, transparent); }
@media (prefers-reduced-motion: no-preference) {
  .pair { animation: drop .45s cubic-bezier(.3,1.3,.5,1) both; animation-delay: calc(var(--i) * 70ms); }
  @keyframes drop { from { opacity: 0; transform: translateY(-8px) rotate(-1.5deg); } to { opacity: 1; transform: none; } }
}
footer { font-size: 12px; color: var(--muted); text-align: center; }
</style>

<div class="wrap">
  <header>
    <span class="eyebrow">CHRISTMAS GIFT EXCHANGE</span>
    <h1>聖誕交換禮物抽籤</h1>
    <ul class="rules">
      <li>每個人會抽到一個顏色，準備的禮物<b>本身</b>要符合那個顏色。（包裝紙、提袋等不算）</li>
      <li>當天禮物會編號，抽編號交換禮物。</li>
    </ul>
  </header>

  <section class="panel">
    <div class="row" hidden>
      <div class="field">
        <label for="names">參加名單 <span class="example" id="exNames">暫定</span></label>
        <textarea id="names" rows="8"></textarea>
        <p class="hint">一行一個名字。<span class="count" id="nameCount"></span></p>
      </div>
      <div class="field">
        <label for="colors">顏色 <span class="example" id="exColors">暫定</span></label>
        <textarea id="colors" rows="8"></textarea>
        <p class="hint">一行一個顏色。<span class="count" id="colorCount"></span></p>
      </div>
    </div>
    <p class="msg" id="err" hidden></p>
    <div class="actions">
      <button class="primary big" id="drawBtn">抽籤</button>
    </div>
  </section>

  <section class="panel" id="results" hidden>
    <div class="results-head">
      <h2>抽籤結果</h2>
      <div class="actions">
        <button class="ghost" id="copyBtn">複製結果</button>
        <span class="note" id="copied" hidden></span>
      </div>
    </div>
    <div class="list" id="list"></div>
  </section>

  <footer>再按一次「抽籤」會重新抽。</footer>
</div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const KEY = "xmas-exchange-v7";
  const EX_NAMES = "彭丞麒\n邱宇婷\n廖志翔\n王灝庭\n葉昕逵\n謝彥守\n張博傑\n廖振凱\n林妤茜\n詹孟真\n陳晉偉\n吳宛蓁\n劉亦謙\n劉倫綱\n游婉𤩦";
  const EX_COLORS = "紅\n綠\n金\n銀\n白\n黑\n藍\n紫";
  // Swatch colors for common names; anything else shows text only.
  const SW = { 紅: "#c8283c", 綠: "#2e8b57", 金: "#d4a537", 銀: "#c0c4c8", 白: "#ffffff", 黑: "#1a1a1a", 藍: "#2f6fd6", 紫: "#7b4bb5",
    黃: "#f2c94c", 橘: "#ee7d2b", 粉紅: "#f29bb7", 粉: "#f29bb7", 咖啡: "#7a5233", 棕: "#7a5233", 灰: "#8a8f94" };
  const swOf = (c) => SW[c] || SW[c.replace(/色$/, "")];

  let state = { names: EX_NAMES, colors: EX_COLORS, exNames: false, exColors: false, result: null };
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
  function load() { try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s && s.result) state.result = s.result; } catch (e) {} }

  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const lines = (t) => t.split(/[\n,，、]+/).map((s) => s.trim()).filter(Boolean);
  function rand() { const u = new Uint32Array(1); crypto.getRandomValues(u); return u[0] / 4294967296; }
  function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  // Color: every color used before any repeats (no repeats at all if there are enough colors).
  function drawColors(n, colors) {
    let pool = [];
    while (pool.length < n) pool = pool.concat(shuffle(colors));
    return shuffle(pool.slice(0, n));
  }

  function counts() {
    const n = lines($("names").value).length, c = lines($("colors").value).length;
    $("nameCount").textContent = n ? `目前 ${n} 人` : "";
    $("colorCount").textContent = c ? `目前 ${c} 色` + (n > c ? "，人比顏色多，會有人同色" : "") : "";
  }
  function showErr(t) { $("err").textContent = t; $("err").hidden = !t; }

  function doDraw() {
    const names = lines(state.names), colors = [...new Set(lines(state.colors))];
    if (names.length < 1) return showErr("請至少輸入一個名字。");
    const dup = names.filter((n, i) => names.indexOf(n) !== i);
    if (dup.length) return showErr(`名字重複：${[...new Set(dup)].join("、")}。請加上姓氏或綽號區分。`);
    if (!colors.length) return showErr("請至少輸入一個顏色。");
    showErr("");
    const col = drawColors(names.length, colors);
    state.result = names.map((g, i) => ({ from: g, color: col[i] }));
    save(); renderResults();
    $("results").scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function renderResults() {
    const r = state.result;
    $("results").hidden = !r; $("copied").hidden = true;
    if (!r) return;
    $("list").innerHTML = r.map((x, i) => {
      const s = swOf(x.color);
      const chip = s ? `<span class="chip"><span class="sw" style="--sw:${s}"></span>${esc(x.color)}</span>` : `<span class="chip nosw">${esc(x.color)}</span>`;
      return `<div class="pair" style="--i:${i}"><span class="p">${esc(x.from)}</span>${chip}</div>`;
    }).join("");
  }

  $("names").addEventListener("input", () => { state.names = $("names").value; state.exNames = false; $("exNames").hidden = true; counts(); save(); });
  $("colors").addEventListener("input", () => { state.colors = $("colors").value; state.exColors = false; $("exColors").hidden = true; counts(); save(); });
  $("drawBtn").onclick = doDraw;
  $("copyBtn").onclick = () => {
    const text = state.result.map((x) => `${x.from}：${x.color}`).join("\n");
    const done = (t) => { $("copied").textContent = t; $("copied").hidden = false; };
    navigator.clipboard.writeText(text).then(() => done("已複製"), () => done("無法自動複製，請手動選取"));
  };

  load();
  $("names").value = state.names; $("colors").value = state.colors;
  $("exNames").hidden = !state.exNames; $("exColors").hidden = !state.exColors;
  counts(); renderResults();
})();
</script>
