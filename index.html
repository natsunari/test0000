<title>聖誕交換禮物抽籤</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: a pine-green winter night with falling snow; a string of lights, a candy-cane rules card,
   a red gift button, then the results as cream gift tags in two columns. Single festive look by choice. */
:root {
  --night: #0d271d;
  --night-hi: #17452f;
  --cream: #fbf3e1;
  --cream-ink: #3b2a17;
  --cream-muted: #7a6a52;
  --red: #c8283c;
  --red-deep: #8f1426;
  --gold: #e0b54f;
  --pine: #2e7d57;
  --frost: #d4e3da;
  --frost-dim: #9fb8aa;
  --font-display: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-script: "Mountains of Christmas", cursive;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--night); }
body {
  min-height: 100vh;
  background: radial-gradient(120% 70% at 50% 0%, var(--night-hi) 0%, var(--night) 70%) fixed, var(--night);
  color: var(--frost);
  font-family: var(--font-body); font-size: 15px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
#snow { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
.wrap { position: relative; z-index: 1; max-width: 640px; margin: 0 auto; display: grid; gap: 22px; }

/* String of lights */
.lights { position: relative; height: 54px; overflow: hidden; margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); }
.lights::before { /* the wire */
  content: ""; position: absolute; left: -5%; right: -5%; top: -26px; height: 44px;
  border-bottom: 2px solid #2a3a30; border-radius: 0 0 50% 50% / 0 0 100% 100%;
}
.bulbs { position: absolute; inset: 0; display: flex; justify-content: space-around; }
.bulb { --c: var(--red); position: relative; width: 12px; height: 18px; margin-top: calc(var(--y) * 1px);
  border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%; background: var(--c); box-shadow: 0 0 10px 2px var(--c); }
.bulb::before { content: ""; position: absolute; top: -5px; left: 3px; width: 6px; height: 6px; border-radius: 2px; background: #3b4a40; }
.bulb:nth-child(4n+2) { --c: var(--gold); }
.bulb:nth-child(4n+3) { --c: #3fbf7f; }
.bulb:nth-child(4n+4) { --c: #4f9bff; }
@media (prefers-reduced-motion: no-preference) {
  .bulb { animation: twinkle 2.4s ease-in-out infinite; animation-delay: calc(var(--d) * -1s); }
  @keyframes twinkle { 0%, 100% { opacity: 1; } 50% { opacity: .35; box-shadow: none; } }
}

header { display: grid; gap: 4px; justify-items: center; text-align: center; }
.merry { font-family: var(--font-script); font-size: clamp(26px, 7vw, 34px); color: var(--gold); line-height: 1.1; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(32px, 8.5vw, 46px); line-height: 1.15; margin: 0; color: var(--cream); text-wrap: balance;
  text-shadow: 0 2px 0 var(--red-deep), 0 0 24px rgba(224, 181, 79, .25); }

/* Rules card: candy-cane edge */
.rules-card { position: relative; background: var(--cream); color: var(--cream-ink); border-radius: 12px; padding: 22px 20px 16px; overflow: hidden; }
.rules-card::before { content: ""; position: absolute; inset: 0 0 auto; height: 8px;
  background: repeating-linear-gradient(-45deg, var(--red) 0 10px, #ffffff 10px 20px); }
.rules-card h2 { margin: 0 0 6px; font-family: var(--font-display); font-size: 19px; color: var(--red-deep); }
.rules { margin: 0; padding-left: 1.3em; display: grid; gap: 6px; }
.rules li::marker { color: var(--red); }
.rules b { color: var(--red-deep); }
.rules .aside { color: var(--cream-muted); font-size: 13px; }

/* Draw button: a red gift with a gold ribbon */
.draw { display: grid; justify-items: center; gap: 10px; }
#drawBtn {
  position: relative; font: inherit; cursor: pointer; border: 0; border-radius: 14px;
  padding: 16px 44px 16px 40px; display: inline-flex; align-items: center; gap: 12px;
  font-family: var(--font-display); font-size: 24px; font-weight: 700; color: #fff8e8; letter-spacing: .1em;
  background: linear-gradient(90deg, transparent 0 22px, var(--gold) 22px 30px, transparent 30px), linear-gradient(180deg, #d93448, var(--red-deep));
  box-shadow: 0 0 0 2px var(--gold) inset, 0 8px 24px rgba(200, 40, 60, .4);
  transition: transform .15s ease, box-shadow .15s ease;
}
#drawBtn svg { width: 26px; height: 26px; margin-left: 8px; flex: none; }
#drawBtn:hover { transform: translateY(-2px); box-shadow: 0 0 0 2px var(--gold) inset, 0 12px 30px rgba(200, 40, 60, .55); }
#drawBtn:active { transform: translateY(1px); }
#drawBtn:disabled { cursor: default; opacity: .7; transform: none; }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.draw .hint { margin: 0; font-size: 13px; color: var(--frost-dim); }

/* Results */
#results { background: rgba(255, 255, 255, .05); border: 1px solid rgba(224, 181, 79, .35); border-radius: 14px; padding: 20px; display: grid; gap: 16px; }
.results-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; }
.results-head h2 { font-family: var(--font-display); font-size: 24px; margin: 0; color: var(--cream); }
.copy { display: flex; align-items: center; gap: 10px; }
#copyBtn { font: inherit; cursor: pointer; border-radius: 8px; padding: 8px 16px; background: transparent; color: var(--cream); border: 1px solid rgba(251, 243, 225, .4); }
#copyBtn:hover { border-color: var(--gold); color: var(--gold); }
.note { font-size: 13px; color: var(--frost-dim); }

.list { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.pair {
  position: relative; background: var(--cream); color: var(--cream-ink);
  border-radius: 6px 14px 14px 6px; padding: 10px 10px 10px 14px;
  display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 10px;
  box-shadow: 0 3px 0 rgba(0, 0, 0, .25);
}
.pair::before { display: none;
  content: ""; position: absolute; left: 11px; top: 50%; width: 9px; height: 9px; margin-top: -4.5px;
  border-radius: 50%; background: var(--night); box-shadow: 0 0 0 2px var(--red);
}
.pair .p { font-family: var(--font-display); font-size: 18px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 10px 2px 3px; border-radius: 99px; border: 1px solid #e6d9bd; background: #ffffff; color: var(--cream-ink); font-weight: 700; white-space: nowrap; }
.chip.nosw { padding-left: 10px; }
.sw { width: 18px; height: 18px; border-radius: 50%; flex: none; border: 1px solid #d9ccb0; background: var(--sw, transparent); }
@media (max-width: 480px) {
  #results { padding: 16px 12px; }
  .list { gap: 8px; }
  .pair { padding: 9px 6px; gap: 5px; grid-template-columns: 1fr; justify-items: center; text-align: center; }
  .pair .p { max-width: 100%; }
  .pair::before { left: 8px; width: 7px; height: 7px; margin-top: -3.5px; }
  .pair .p { font-size: 17px; }
}
@media (max-width: 370px) {
  .pair .p { font-size: 15px; }
  .chip { gap: 3px; padding: 1px 7px 1px 2px; font-size: 14px; }
  .sw { width: 14px; height: 14px; }
}
@media (prefers-reduced-motion: no-preference) {
  .pair { animation: drop .5s cubic-bezier(.3,1.3,.5,1) both; animation-delay: calc(var(--i) * 60ms); transform-origin: 6px 50%; }
  @keyframes drop { from { opacity: 0; transform: translateY(-10px) rotate(-4deg); } to { opacity: 1; transform: none; } }
}
footer { font-size: 12px; color: var(--frost-dim); text-align: center; }

/* Santa intermission */
#intro { position: fixed; inset: 0; z-index: 30; overflow: hidden; background: rgba(6, 22, 16, .96); display: grid; place-items: end center;
  padding-bottom: max(18vh, env(safe-area-inset-bottom, 0px)); opacity: 1; transition: opacity .35s ease; }
#intro.out { opacity: 0; }
.moon { position: absolute; top: 12vh; right: 12vw; width: 110px; height: 110px; border-radius: 50%;
  background: radial-gradient(circle at 40% 40%, #fff9e6, #f2dfa8); box-shadow: 0 0 60px 20px rgba(242, 223, 168, .25); }
.sleigh { position: absolute; left: 50%; top: 42%; width: min(380px, 86vw); margin-left: calc(min(380px, 86vw) / -2); }
.sleigh svg { display: block; width: 100%; height: auto; overflow: visible; }
.deer { transform-box: fill-box; transform-origin: center; }
.intro-text { position: relative; font-size: 18px; font-weight: 700; color: var(--cream); letter-spacing: .05em; text-align: center; }
.intro-text small { display: block; font-size: 13px; font-weight: 400; color: var(--frost-dim); letter-spacing: 0; }
.spark { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 8px 2px rgba(224, 181, 79, .7); pointer-events: none; }
@media (prefers-reduced-motion: no-preference) {
  .sleigh { animation: fly 5s cubic-bezier(.45, .05, .55, .95) both; }
  @keyframes fly {
    0%   { transform: translate(-115vw, 60px) rotate(-8deg); }
    50%  { transform: translate(0, -10px) rotate(-3deg); }
    100% { transform: translate(115vw, -90px) rotate(-10deg); }
  }
  .deer { animation: gallop .3s ease-in-out infinite alternate; }
  .deer.d2 { animation-delay: -.15s; }
  @keyframes gallop { from { transform: translateY(-3px) rotate(-3deg); } to { transform: translateY(3px) rotate(3deg); } }
  .spark { animation: spark .9s ease-out forwards; }
  @keyframes spark { to { opacity: 0; transform: translateY(26px) scale(.3); } }
  .nose { animation: glow .6s ease-in-out infinite alternate; }
  @keyframes glow { to { opacity: .55; } }
}
</style>

<canvas id="snow" aria-hidden="true"></canvas>

<div class="wrap">

  <header>
    <span class="merry">Merry Christmas</span>
    <h1>聖誕交換禮物抽籤</h1>
  </header>

  <section class="rules-card">
    <h2>遊戲規則</h2>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const KEY = "xmas-exchange-v8";
  const NAMES = ["彭丞麒", "邱宇婷", "廖志翔", "王灝庭", "葉昕逵", "謝彥守", "張博傑", "廖振凱", "林妤茜", "詹孟真", "陳晉偉", "吳宛蓁", "劉亦謙", "劉倫綱", "游婉潔"];
  const COLORS = ["紅", "綠", "金", "銀", "白", "黑", "藍", "紫"];
  const SW = { 紅: "#c8283c", 綠: "#2e8b57", 金: "#d4a537", 銀: "#c0c4c8", 白: "#ffffff", 黑: "#1a1a1a", 藍: "#2f6fd6", 紫: "#7b4bb5" };

  let result = null;
  try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s && s.result) result = s.result; } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ result })); } catch (e) {} };

  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  function rand() { const u = new Uint32Array(1); crypto.getRandomValues(u); return u[0] / 4294967296; }
  function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  // Every color is used before any repeats.
  function drawColors(n) {
    let pool = [];
    while (pool.length < n) pool = pool.concat(shuffle(COLORS));
    return shuffle(pool.slice(0, n));
  }

  function render() {
    $("results").hidden = !result; $("copied").hidden = true;
    if (!result) return;
    $("list").innerHTML = result.map((x, i) => {
      const s = SW[x.color];
      const chip = s ? `<span class="chip"><span class="sw" style="--sw:${s}"></span>${esc(x.color)}</span>` : `<span class="chip nosw">${esc(x.color)}</span>`;
      return `<div class="pair" style="--i:${i}"><span class="p">${esc(x.from)}</span>${chip}</div>`;
    }).join("");
  }

  let busy = false;
  $("drawBtn").onclick = () => {
    if (busy) return;
    busy = true; $("drawBtn").disabled = true;
    const col = drawColors(NAMES.length);
    const next = NAMES.map((g, i) => ({ from: g, color: col[i] }));
    playIntro(() => {
      result = next; save(); render(); busy = false; $("drawBtn").disabled = false;
      $("results").scrollIntoView({ behavior: "smooth", block: "start" });
    });
  };

  // Santa flies across for ~5 seconds, leaving a trail of gold sparks, then the results appear.
  function playIntro(done) {
    const intro = $("intro"), sleigh = $("sleigh");
    const quiet = matchMedia("(prefers-reduced-motion: reduce)").matches;
    intro.classList.remove("out"); intro.hidden = false;
    sleigh.style.animation = "none"; void sleigh.offsetWidth; sleigh.style.animation = "";
    let timer = 0;
    if (!quiet) timer = setInterval(() => {
      const r = sleigh.getBoundingClientRect();
      const s = document.createElement("span"); s.className = "spark";
      s.style.left = (r.left + r.width * 0.05 + (rand() - .5) * 14) + "px";
      s.style.top = (r.top + r.height * 0.8 + (rand() - .5) * 14) + "px";
      intro.appendChild(s); setTimeout(() => s.remove(), 900);
    }, 45);
    setTimeout(() => {
      clearInterval(timer); intro.classList.add("out");
      setTimeout(() => { intro.hidden = true; intro.querySelectorAll(".spark").forEach((s) => s.remove()); done(); }, 350);
    }, quiet ? 1200 : 5000);
  }
  $("copyBtn").onclick = () => {
    const text = result.map((x) => `${x.from}：${x.color}`).join("\n");
    const done = (t) => { $("copied").textContent = t; $("copied").hidden = false; };
    navigator.clipboard.writeText(text).then(() => done("已複製"), () => done("無法自動複製，請手動選取"));
  };

  // String of lights
  const bulbs = $("bulbs"), count = 14;
  for (let i = 0; i < count; i++) {
    const t = (i + 0.5) / count, y = 6 + Math.sin(t * Math.PI) * 22; // follow the sagging wire
    const b = document.createElement("span"); b.className = "bulb";
    b.style.setProperty("--y", y.toFixed(1)); b.style.setProperty("--d", (rand() * 2.4).toFixed(2));
    bulbs.appendChild(b);
  }

  // Snow
  const cv = $("snow"), ctx = cv.getContext("2d");
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W = 0, H = 0, flakes = [];
  function size() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.round(Math.min(110, W * H / 9000));
    flakes = Array.from({ length: n }, () => ({ x: rand() * W, y: rand() * H, r: 0.8 + rand() * 2.4, s: 0.3 + rand() * 0.9, w: rand() * Math.PI * 2 }));
    if (still) paint();
  }
  function paint() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = "rgba(255,255,255,0.8)";
    for (const f of flakes) { ctx.globalAlpha = 0.35 + f.r / 4; ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2); ctx.fill(); }
    ctx.globalAlpha = 1;
  }
  function tick() {
    for (const f of flakes) {
      f.y += f.s; f.w += 0.01; f.x += Math.sin(f.w) * 0.4;
      if (f.y > H + 4) { f.y = -4; f.x = rand() * W; }
    }
    paint(); requestAnimationFrame(tick);
  }
  addEventListener("resize", size); size();
  if (!still) requestAnimationFrame(tick);

  render();
})();
</script>
