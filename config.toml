# ============================================================
#  出差飯店搜尋 — 規則設定檔
#
#  這裡放「死的」限制，搜尋時程式不會問你，直接套用。
#  改規則就改這個檔，改完存檔即可，不用碰程式碼。
#
#  格式規則（避免改壞）：
#    - 等號左邊的英文名稱不要改
#    - 數字直接寫，不要加引號
#    - 文字要用雙引號包起來
#    - # 開頭的是註解，程式會忽略
# ============================================================

[budget]
# 公司規範：飯店住宿費用上限（美金／每晚）
hotel_max_per_night_usd = 180

# 公司規範：交通費上限（美金）
# 單趟 = 飯店到目的地的單程車資
# 每日 = 通常是來回兩趟
taxi_max_one_way_usd = 20
taxi_max_per_day_usd = 40


[accommodation]
# 只接受「飯店」。SerpApi 的 type 欄位可能出現的值：
#   "hotel"           飯店          ← 只要這個
#   "vacation rental" 民宿／短租公寓  ← 排除
allowed_types = ["hotel"]

# 註：你的「獨立衛浴」需求由這條規則保證。
# 共用衛浴是青年旅館的特徵，只收 hotel 就等於排除了共用衛浴。


[availability]
# 是否只列出「查詢當下有空房」的飯店。
#
# 判斷方式：Google 是帶著你的入住日期去查的，拿不到可訂價格就代表訂不了。
# 所以「有 rate_per_night」就當成「可訂」。
#
# 實測 20 筆東京資料，沒價格的 2 筆都不是沒空房，而是根本不該出現的東西 ——
# 一筆是產後護理之家、一筆是飯店附設餐廳，兩筆 type 都被 Google 標成 "hotel"。
# 所以這道過濾同時補上了 type 欄位不可靠的漏洞，建議保持開啟。
#
# ⚠️ 這代表「查詢當下顯示有可訂價格」，不等於你點進去一定訂得到。
#    房間可能在你查完之後被別人訂走，這是任何工具都無法保證的。
#
# 設成 false 的話，沒有價格的飯店會保留並標記待確認，而不是排除。
require = true


[required]
# 必要條件。只有「明確標示沒有」才會淘汰；
# 資料沒提到時會保留並標記「待確認」，不會誤刪。
air_conditioning = true
elevator = true


[preferred]
# 加分條件。不符合也不淘汰，只影響排序。
breakfast = true


[distance]
# 直線距離換算成實際道路距離的倍數。車子不能直線飛過去。
# 1.3 = 實際路程約為直線的 1.3 倍，一般市區適用。
# 路網方正的城市（京都、曼哈頓）可降到 1.2
# 山路或河流多的城市（重慶、舊金山）可升到 1.5
road_detour_factor = 1.3

# 走路可達的門檻（公里）。這個距離內視為不需要搭車，交通費算 0。
# 1.0 公里大約是走路 12~15 分鐘。
# 帶行李或天氣熱的城市可以調小到 0.7，習慣走路可以調大到 1.5。
walking_max_km = 1.0


[exchange_rate]
# 飯店房價 SerpApi 已直接回傳美金，這裡主要用於換算你填的當地計程車費率。
source = "frankfurter"      # 免費、不需申請金鑰
# 緩衝百分比：吸收信用卡海外手續費（通常 1~2%）與數日匯率波動。
# 設 3 代表 $176 會被當成 $181.28 來判斷，寧可保守以免核銷時才發現超標。
buffer_percent = 3


# ============================================================
#  計程車／Uber 費率
#
#  每個城市不同，去過一次填一次，之後就不用再查。
#  怎麼查：開 Uber App 隨便估一段路反推，或 Google「<城市> taxi fare per km」。
#  不用非常精確，這是用來刷掉明顯超標的飯店，不是報帳用的。
#
#  城市名稱用引號包起來，中英文都可以，要跟你搜尋時輸入的一致。
# ============================================================
[taxi_fare.default]
# 找不到該城市時用這組。
#
# ⚠️ 這組數字必須在「任何距離」都不低於底下列出的每一個城市，否則就不算保守。
#    起跳高、每公里低的組合會在長距離時反而低估 —— test_rules.py 有一條測試
#    會在 1~20 公里範圍逐一比對，改這兩個數字前請先跑過測試。
base_usd = 4.0
per_km_usd = 3.2

[taxi_fare."Tokyo"]
base_usd = 3.2
per_km_usd = 2.8

[taxi_fare."Urayasu"]
# 東京迪士尼所在地（千葉縣浦安市），費率與東京都會區相近
base_usd = 3.2
per_km_usd = 2.8

[taxi_fare."Singapore"]
base_usd = 3.0
per_km_usd = 1.5

[taxi_fare."Bangkok"]
base_usd = 1.1
per_km_usd = 0.5


# ============================================================
#  設施字串比對表
#
#  Google 回傳的設施是英文字串，寫法不固定。
#  在這裡維護「哪些字代表有、哪些字代表沒有」，發現新寫法就加進來。
#
#  ⚠️ 兩邊都沒命中 = 「不知道」，不是「沒有」。
#     實測 20 間東京飯店，只有 2 間標了冷氣、1 間標了電梯，
#     但那些飯店實際上都有。所以「沒寫」只代表 Google 沒這筆資料。
#     程式會保留並標記待確認，不會淘汰。
# ============================================================
[amenity_match.air_conditioning]
means_yes = ["Air conditioning", "Air conditioner", "AC"]
means_no = ["No air conditioning"]

[amenity_match.elevator]
means_yes = ["Elevator", "Lift"]
means_no = ["No elevator"]

[amenity_match.breakfast]
means_yes = ["Free breakfast", "Breakfast", "Breakfast ($)", "Breakfast included"]
means_no = ["No breakfast"]

# 註：Google 的 "Private bath" / "Public bath" 在日本語境指的是
# 貸切風呂與大浴場，與房內衛浴無關，所以刻意不拿來比對「獨立衛浴」。


# ============================================================
#  畫面顯示用的中文名稱
# ============================================================
[labels]
air_conditioning = "獨立冷氣或空調"
elevator = "電梯可達"
breakfast = "附早餐"
