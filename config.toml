# ============================================================
#  出差飯店搜尋 — 規則設定檔
#
#  這裡放「死的」限制，搜尋時程式不會問你，直接套用。
#  改規則就改這個檔，改完存檔即可，不用碰程式碼。
#
#  格式規則（避免改壞）：
#    - 等號左邊的英文名稱不要改
#    - 數字直接寫，不要加引號
#    - 文字要用雙引號包起來
#    - # 開頭的是註解，程式會忽略
# ============================================================

[budget]
# 公司規範：飯店住宿費用上限（美金／每晚）
hotel_max_per_night_usd = 180

# 最低房價（美金／每晚）。低於這個價格的排除。
#
# 這不是省錢規則，是用來擋青年旅館 ——
# 名稱過濾只擋得住名字裡有 hostel、backpacker 的，
# 但「Sydney Central Inn」「Wake Up! Sydney」「The Lansdowne Hotel」
# 這些名字看不出來，價格卻一眼就看得出來：
# 雪梨實測六間通舖都在 US$29–40，而當地正常飯店約 US$100 起跳。
#
# 0 = 關閉。各地物價差很多（曼谷 US$30 可能是正常飯店），
# 所以沒有通用的預設值，請依目的地自己設。
# 設定面板上可以隨時調整，不用改這個檔。
hotel_min_per_night_usd = 0

# 公司規範：交通費上限（美金）
# 單趟 = 飯店到目的地的單程車資
# 每日 = 通常是來回兩趟
taxi_max_one_way_usd = 20
taxi_max_per_day_usd = 40


[accommodation]
# 只接受「飯店」。SerpApi 的 type 欄位可能出現的值：
#   "hotel"           飯店          ← 只要這個
#   "vacation rental" 民宿／短租公寓  ← 排除
allowed_types = ["hotel"]

# 註：你的「獨立衛浴」需求主要由這條規則保證。
# 共用衛浴是青年旅館的特徵，只收 hotel 就等於排除了大部分共用衛浴。

# 但有些青年旅館會把自己登記成 "hotel"（澳洲、歐洲特別常見），
# type 欄位擋不住。這裡再用名稱關鍵字補一道。
#
# ⚠️ 這是「看名字猜」，不是看資料，所以兩個方向都可能出錯：
#    名字裡有這些字但其實是正常飯店 → 會被誤刪
#    是通舖但名字看不出來           → 擋不住
#    覺得誤判就改這個清單。
#
# 比對規則：不分大小寫，而且只比對「詞首」。
#   "hostel" 會命中 Hostel、Hostels、Hostelling
#   但不會命中名字中間剛好有這幾個字母的字。
#
# ⚠️ 刻意不放 "dorm"：日本的 Dormy Inn 是正常商務飯店連鎖，
#    有獨立房間與衛浴，用 "dorm" 會把它誤殺。改用完整的 "dormitory"。
exclude_name_keywords = [
  "hostel", "hostal", "backpacker", "yha",
  "dormitory", "bunk", "capsule", "pod hotel",
  "share house", "sharehouse",
]

# 有些飯店的簡介（description 欄位）會直接寫出來。
# 這比看名字可靠 —— 那是資料，不是從名字推測的。
#
# 這裡只放「寫出來幾乎就確定不符合」的字。
# 比對不分大小寫，而且是詞首比對（hostel 會命中 hostels）。
#
# 已用雪梨實際資料驗證。Google 的寫法例如：
#   Sydney Central Inn → "Simple hostel with low-key dorms & private rooms…"
# 注意真實用字是複數的 "dorms"，不是 "dormitory"。
#
# ⚠️ 刻意不放單數的 "dorm"：日本的 Dormy Inn 是正常商務飯店，
#    它的簡介裡會出現自己的名字，用 "dorm" 會誤殺。
exclude_description_keywords = [
  "shared bathroom", "shared facilities", "communal bathroom",
  "dorms", "dormitory", "dormitories", "dorm room", "dorm bed",
  "mixed dorm", "female dorm",
  "bunk bed",
  "hostel", "backpacker",
]


[availability]
# 是否只列出「查詢當下有空房」的飯店。
#
# 判斷方式：Google 是帶著你的入住日期去查的，拿不到可訂價格就代表訂不了。
# 所以「有 rate_per_night」就當成「可訂」。
#
# 實測 20 筆東京資料，沒價格的 2 筆都不是沒空房，而是根本不該出現的東西 ——
# 一筆是產後護理之家、一筆是飯店附設餐廳，兩筆 type 都被 Google 標成 "hotel"。
# 所以這道過濾同時補上了 type 欄位不可靠的漏洞，建議保持開啟。
#
# ⚠️ 這代表「查詢當下顯示有可訂價格」，不等於你點進去一定訂得到。
#    房間可能在你查完之後被別人訂走，這是任何工具都無法保證的。
#
# 設成 false 的話，沒有價格的飯店會保留並標記待確認，而不是排除。
require = true


[required]
# 必要條件。只有「明確標示沒有」才會淘汰；
# 資料沒提到時會保留並標記「待確認」，不會誤刪。
air_conditioning = true
elevator = true


[assume_when_unknown]
# 資料未標示時，是否「推定為有」而不列入待確認。
#
# 為什麼需要這個：實測 20 間東京飯店，只有 2 間標了冷氣。
# 但那些飯店實際上都有冷氣 —— 沒寫只是 Google 沒收錄這筆資料。
# 每張卡片都掛著「冷氣：不知道」既吵又沒意義。
#
# ⚠️ 推定不是確認。畫面上會顯示「推定有」而不是「有」，不會假裝是查證過的。
air_conditioning = true    # 飯店幾乎都有冷氣
elevator = true            # 多數飯店有電梯；明確標示「No elevator」的仍會被淘汰
#
# 注意推定與確認的差別：這兩項設為 true 只是不再列入待確認，
# 卡片上仍然顯示「？」而不是「Ｏ」。真的在意就點進飯店頁面看一眼。
# 資料若明確寫「沒有」，不管這裡設什麼都一律淘汰。


[preferred]
# 加分條件。不符合也不淘汰，只影響排序。
breakfast = true


[distance]
# 直線距離換算成實際道路距離的倍數。車子不能直線飛過去。
# 1.3 = 實際路程約為直線的 1.3 倍，一般市區適用。
# 路網方正的城市（京都、曼哈頓）可降到 1.2
# 山路或河流多的城市（重慶、舊金山）可升到 1.5
road_detour_factor = 1.3

# 走路可達的門檻（公里）。這個距離內視為不需要搭車，交通費算 0。
# 0.6 公里（600 公尺）粗估步行約 10 分鐘，是帶著行李仍然合理的距離。
# 這個值刻意不放在網頁的設定面板上 —— 它是「怎麼算」的參數，
# 不是公司規範，不該讓人每次搜尋前都猶豫要設多少。
walking_max_km = 0.6


[exchange_rate]
# 飯店房價 SerpApi 已直接回傳美金，這裡主要用於換算你填的當地計程車費率。
source = "frankfurter"      # 免費、不需申請金鑰
# 緩衝百分比：吸收信用卡海外手續費（通常 1~2%）與數日匯率波動。
# 設 3 代表 $176 會被當成 $181.28 來判斷，寧可保守以免核銷時才發現超標。
buffer_percent = 3


# ============================================================
#  計程車／Uber 費率
#
#  查詢順序：先找城市，找不到找國家，再找不到用 default。
#
#  四個欄位：
#    currency    = 費率用什麼幣別寫（程式會自動換算成美金）
#    base        = 起跳價
#    included_km = 起跳價「已經含」多少公里（沒有就填 0）
#    per_km      = 超過之後每公里多少
#
#  直接照官方公告填，不用自己換算成美金，也不用自己扣掉內含里程。
#
#  怎麼查：Google「<城市> taxi fare」通常能找到官方或交通局的公告；
#  或開 Uber App 估一段路反推。不用非常精確 ——
#  這是用來刷掉明顯超標的飯店，不是報帳用的。
# ============================================================
[taxi_fare.default]
# 找不到城市也找不到國家時用這組。刻意估貴，寧可誤報超標也不要讓你超支。
#
# ⚠️ 這組數字必須在任何距離都不低於底下列出的每一個地區，否則就不算保守。
#    test_rules.py 有一條測試會逐一比對，改這些數字前請先跑過測試。
currency = "USD"
base = 4.0
included_km = 0
per_km = 3.2


# ------------------------------------------------------------
#  依國家（用 OpenStreetMap 回傳的兩碼國碼）
#
#  ⚠️ 這裡只放「有來源可查證」的數字。
#     我不會憑印象填其他國家 —— 填低了會讓你以為沒超標、實際上超了，
#     那比留著保守預設值危險得多。
#     你去過哪個國家，就把當地的實際費率加一筆進來。
# ------------------------------------------------------------
[taxi_fare_by_country.tw]
# 台北市計程車日間費率（06:00–23:00），依台北市公運處公告：
#   起程 85 元含 1.25 公里，之後每 200 公尺 5 元（＝每公里 25 元）
# 夜間 23:00–06:00 每趟加收 20 元、春節加收 30 元，此處未計入。
currency = "TWD"
base = 85
included_km = 1.25
per_km = 25


# ------------------------------------------------------------
#  依城市（比國家優先）
#  以下為粗估值，不是官方公告，去過之後請換成實際數字。
# ------------------------------------------------------------
[taxi_fare."Tokyo"]
currency = "USD"
base = 3.2
included_km = 0
per_km = 2.8

[taxi_fare."Urayasu"]
# 東京迪士尼所在地（千葉縣浦安市），費率與東京都會區相近
currency = "USD"
base = 3.2
included_km = 0
per_km = 2.8

[taxi_fare."Sydney"]
# 雪梨跳錶費率，白天 06:00–21:59：
#   起錶 A$5.17（不含里程），前 12 公里每公里 A$2.61
#
# ⚠️ 兩點沒有建模，都說明如下：
#   1. 超過 12 公里後降為 A$2.37/km —— 用不到。單趟上限 $20 美金
#      換算下來約 5.7 公里就到頂，永遠走不到 12 公里那一段。
#   2. 夜間 22:00–05:59 漲到 A$3.10/km（約貴 19%）—— 這裡用白天費率。
#      展期通勤多半在白天；如果你會晚歸，把 per_km 改成 3.10 比較保險。
currency = "AUD"
base = 5.17
included_km = 0
per_km = 2.61

[taxi_fare."Singapore"]
currency = "USD"
base = 3.0
included_km = 0
per_km = 1.5

[taxi_fare."Bangkok"]
currency = "USD"
base = 1.1
included_km = 0
per_km = 0.5


# ============================================================
#  設施字串比對表
#
#  Google 回傳的設施是英文字串，寫法不固定。
#  在這裡維護「哪些字代表有、哪些字代表沒有」，發現新寫法就加進來。
#
#  ⚠️ 兩邊都沒命中 = 「不知道」，不是「沒有」。
#     實測 20 間東京飯店，只有 2 間標了冷氣、1 間標了電梯，
#     但那些飯店實際上都有。所以「沒寫」只代表 Google 沒這筆資料。
#     程式會保留並標記待確認，不會淘汰。
# ============================================================
[amenity_match.air_conditioning]
means_yes = ["Air conditioning", "Air conditioner", "AC"]
means_no = ["No air conditioning"]

[amenity_match.elevator]
means_yes = ["Elevator", "Lift"]
means_no = ["No elevator"]

[amenity_match.breakfast]
means_yes = ["Free breakfast", "Breakfast", "Breakfast ($)", "Breakfast included"]
means_no = ["No breakfast"]

# 註：Google 的 "Private bath" / "Public bath" 在日本語境指的是
# 貸切風呂與大浴場，與房內衛浴無關，所以刻意不拿來比對「獨立衛浴」。


# ============================================================
#  畫面顯示用的中文名稱
# ============================================================
[labels]
# 完整名稱，用在說明文字與錯誤訊息裡
air_conditioning = "獨立冷氣或空調"
elevator = "電梯可達"
breakfast = "附早餐"

[short_labels]
# 卡片標籤用的短名稱，前面會加上 Ｏ／Ｘ／？ 符號，例如「Ｏ電梯」
air_conditioning = "空調／冷氣"
elevator = "電梯"
breakfast = "早餐"


