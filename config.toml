# ============================================================
#  出差飯店搜尋 — 規則設定檔
#
#  這裡放的是「死的」限制，搜尋時程式不會問你，直接套用。
#  要改規則就改這個檔案，不用碰程式碼。
#  改完存檔即可，不需要重新安裝任何東西。
# ============================================================

[預算]
# 公司規範：住宿費用上限（美金 / 每晚）
住宿每晚上限_USD = 180

# 公司規範：交通費上限（美金）
# 單趟上限適用於「飯店 ↔ 目的地」的單程車資
# 每日上限 = 通常是來回兩趟，所以是單趟的兩倍
單趟交通上限_USD = 20
每日交通上限_USD = 40


[住宿類型]
# 只接受「飯店」。OpenStreetMap 的分類代號：
#   hotel       = 飯店          ← 只要這個
#   hostel      = 青年旅館
#   guest_house = 民宿
#   apartment   = 公寓式住宿
#   motel       = 汽車旅館
只接受 = ["hotel"]


[必要條件]
# 這些不符合就直接淘汰，不列入候選
獨立衛浴 = true
獨立冷氣或空調 = true
電梯可達 = true


[加分條件]
# 不符合也沒關係，但有的話排序會往前
附早餐 = true


[距離換算]
# 直線距離換算成實際道路距離的倍數。
# 車子不能直線飛過去，所以實際路程會比直線遠。
# 1.3 代表「實際路程大約是直線距離的 1.3 倍」，一般市區用這個值還算準。
# 路網方正的城市（例如京都、曼哈頓）可以調低到 1.2，
# 山路或河流多的城市（例如重慶、舊金山）可以調高到 1.5。
道路彎繞倍數 = 1.3


# ============================================================
#  計程車 / Uber 費率
#
#  每個城市不一樣，去過一次就填一次，之後就不用再查。
#  起跳 = 上車就跳的基本費（美金）
#  每公里 = 之後每多跑一公里加多少（美金）
#
#  怎麼查：Google 搜「<城市> taxi fare per km」，
#  或是開 Uber App 隨便估一段路反推。不用非常精確，
#  這是用來「刷掉明顯超標的飯店」，不是報帳用的。
# ============================================================
[計程車費率.預設]
# 找不到該城市時用這組，寧可估貴一點以免超支
起跳_USD = 3.5
每公里_USD = 2.5

[計程車費率.東京]
起跳_USD = 3.2
每公里_USD = 2.8

[計程車費率.新加坡]
起跳_USD = 3.0
每公里_USD = 1.5

[計程車費率.曼谷]
起跳_USD = 1.1
每公里_USD = 0.5
