# ============================================================
#  城市欄位的下拉建議
#
#  以國際展覽與商務出差常見的城市為主。
#  這只是方便選取，不影響任何篩選 ——
#  清單裡沒有的城市照樣可以直接打進去。
#
#  ⚠️ 在這裡出現不代表有計程車費率。
#     沒填費率的城市會往上找國家，再找不到就用保守預設值，
#     畫面上會標示出來。要加費率請看 [taxi_fare] 那一區。
# ============================================================
[ui]
# 城市下拉建議：城市名稱 → 兩碼國碼。
